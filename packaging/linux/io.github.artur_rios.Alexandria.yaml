# IR-16: the Flatpak manifest.
#
# flutter_distributor covers MSIX, the Windows installer, the AppImage, and the
# .deb, but has no Flatpak target, so this manifest and the flatpak-builder step
# in .github/workflows/release.yml are hand-written.
#
# The bundle carries the Alexandria core's shared object alongside the
# executable: nothing here installs, updates, or launches a service — the core
# travels inside the application as a library (Operations & Infrastructure
# Document §7.3).

app-id: io.github.artur_rios.Alexandria
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: alexandria

# The base runtime ships ffmpeg with the patent-encumbered decoders left out —
# no H.264, H.265, or AAC — which for a personal media library means the common
# case does not play. The extension supplies them, and is the Flatpak answer to
# the same question the .deb answers with Depends and the tarball, installer,
# and AppImage answer by bundling.
#
# add-ld-path puts the extension's directory on the loader's search path, so
# the core finds these rather than the base runtime's narrower build.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: "24.08"
    add-ld-path: .
    no-autodownload: false
    autodelete: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio, because the product plays music and video.
  - --socket=pulseaudio
  # The owner's library folders are the whole point of the application, and the
  # portal cannot express "whatever folders they register later".
  - --filesystem=home

modules:
  - name: alexandria
    buildsystem: simple
    build-commands:
      # The mount point the extension above is attached to. It must exist in
      # the build or there is nothing for Flatpak to mount the extension onto.
      - mkdir -p /app/lib/ffmpeg
      - install -Dm755 alexandria /app/bin/alexandria
      - cp -r data /app/bin/data
      - cp -r lib /app/bin/lib
      - install -Dm644 io.github.artur_rios.Alexandria.desktop
        /app/share/applications/io.github.artur_rios.Alexandria.desktop
      - install -Dm644 io.github.artur_rios.Alexandria.metainfo.xml
        /app/share/metainfo/io.github.artur_rios.Alexandria.metainfo.xml
      # The name the desktop entry's Icon= key refers to, which only resolves
      # if a file of that name is installed in the icon theme.
      - install -Dm644 io.github.artur_rios.Alexandria.png
        /app/share/icons/hicolor/512x512/apps/io.github.artur_rios.Alexandria.png
    sources:
      # Populated by the release workflow from build/linux/x64/release/bundle.
      - type: dir
        path: bundle
      - type: file
        path: io.github.artur_rios.Alexandria.desktop
      - type: file
        path: io.github.artur_rios.Alexandria.metainfo.xml
      - type: file
        path: io.github.artur_rios.Alexandria.png
