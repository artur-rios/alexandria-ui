# IR-03: the Alexandria core bindings are generated from the core's published C
# header, committed, and never hand-edited. A change to the header surfaces as a
# compile error rather than as a runtime crash.
#
# The header is vendored at native/include/alexandria_ffi.h, copied verbatim from
# alexandria-api/crates/alexandria-ffi/src/header.h. CI diffs the two so a drift
# fails the build rather than being discovered at run time.
#
# Regenerate with:
#   dart run ffigen --config ffigen.yaml

name: AlexandriaBindings
description: |
  Generated bindings over the Alexandria core's C ABI.

  DO NOT EDIT. Generated from native/include/alexandria_ffi.h by ffigen.
output: "lib/core/bindings/alexandria_bindings.dart"

headers:
  entry-points:
    - "native/include/alexandria_ffi.h"
  include-directives:
    - "**alexandria_ffi.h"

# The core's doc comment for `alexandria_auth_local_login` cites the HTTP route
# `/v1/auth/local/*`, which puts a `/*` sequence inside a block comment. clang
# warns, and ffigen refuses to emit on a warning. The header is vendored
# verbatim and never hand-edited (IR-03), so the warning is suppressed here
# instead. Raised upstream against alexandria-ffi; this line comes out when the
# header is fixed.
compiler-opts:
  - "-Wno-comment"

# The C symbol names are untouched, per the naming convention in
# docs/requirements/Technology Stack Document.md §5.
functions:
  include:
    - "alexandria_.*"

structs:
  include:
    - ".*Result"

macros:
  include:
    - "INDEX_.*"
    - "FILE_.*"
    - "COLLECTION_.*"
    - "BOOKMARK_.*"
    - "WATCHLIST_.*"
    - "READING_LIST_.*"
    - "AUTH_.*"
    # The run family is separate from INDEX_ by the header's own instruction:
    # they overlap numerically and disagree on what 4 means, so reading one
    # through the other is a misread rather than a shortcut (UC-06).
    - "RUN_.*"
    # The playback family covers the source, thumbnail, and comic-page calls
    # (UC-19, UC-20, UC-23, UC-24). Its own set of codes, as the run family is.
    - "PLAYBACK_.*"
    # The playlist family (playlists Task 1 … Task 7). Its own set of codes,
    # numerically identical to READING_LIST_'s and WATCHLIST_'s by the
    # header's own convention, but a family of its own so the two never
    # cross-read.
    - "PLAYLIST_.*"
    # Music enrichment. Its own family, and the only one carrying a code for
    # "this installation has not configured the feature" — mapped to a
    # configuration failure rather than an invalid input, because the caller
    # did nothing wrong.
    - "ENRICHMENT_.*"
    # Libraries. Its own family, carrying a conflict code the others lack —
    # a folder overlapping an existing library is the catalog's state being
    # wrong, not the caller's request.
    - "LIBRARY_.*"
    # The settings read has its own family too (UC-34's retention window,
    # core UC-47). It carries only OK, unauthorized, not-initialized, and
    # other — reading it through another family's table would be a misread of
    # numbers that happen to line up.
    - "SETTINGS_.*"

comments:
  style: any
  length: full

preamble: |
  // Generated by ffigen from native/include/alexandria_ffi.h — do not edit.
  // See IR-03 in docs/requirements/Operations & Infrastructure Document.md.
  //
  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names
