# IR-16: the packages, produced from the same pipeline on a tagged release.
#
#   Windows   an MSIX package, an installer executable, and a portable .zip
#   Linux     an AppImage, a .deb, a Flatpak, a self-extracting installer,
#             and a portable .tar.gz
#
# Each bundles the Alexandria core's shared library. The core travels inside the
# application bundle as a library: nothing here installs, updates, or launches a
# service (Operations & Infrastructure Document §7.3).
#
# The two portable archives are the whole release bundle and nothing else, for
# running the application without an install step. The two installers are the
# ones that place it: both find an existing installation — in the directory
# chosen, and in the one a previous install recorded — and replace it, removing
# what that install wrote rather than the directory it was written into. See
# packaging/windows/installer.iss and packaging/linux/install.sh.
#
# A tag publishes all of it as a GitHub Release. A workflow_dispatch run does
# not: it has no tag to release against, so it stops at the build artifacts.
#
# Packages are produced unsigned. Code signing for Windows needs a certificate
# the project does not hold, and Flatpak distribution through a public remote
# needs an account that does not exist yet; both are deliberately deferred
# until before the first public release (§7.2).
#
# HOW EACH PACKAGE GETS FFMPEG.
#
# The core links ffmpeg, so libavcodec, libavdevice, libavfilter, libavformat,
# libavutil, libswresample, and libswscale have to be there wherever it runs.
# The Windows packages carry them beside the executable. On Linux the five
# packages do not get one answer, because they are not one kind of thing:
#
#   .deb       depends on the distribution's packages, which is the entire
#              point of a .deb. Targets Ubuntu 24.04, since the soname is part
#              of each package's name and moves between releases. Verified by
#              installing the built package on the runner, so the names are
#              checked against a real apt rather than trusted.
#
#   Flatpak    mounts org.freedesktop.Platform.ffmpeg-full. The base runtime
#              ships ffmpeg without H.264, H.265, or AAC, which for a personal
#              media library means the common case does not play.
#
#   AppImage   carries its own, along with the tarball and the installer.
#   tarball    None of the three has anything to ask: "portable" that runs
#   installer  only where ffmpeg is already installed is not portable.
#              packaging/linux/bundle-libraries.sh walks the dependency graph
#              and copies the closure, leaving glibc, the graphics stack, and
#              the sound daemons to the host.
#
# The two answers are mutually exclusive per package — a bundled copy inside
# the .deb would shadow the system's and then go unpatched — which is why the
# Linux job below builds the .deb and sets the Flatpak's source aside BEFORE
# the bundling step, and everything else after it.
#
# None of this is asserted on the runner alone. The runner installed ffmpeg to
# compile the core, so anything resolving here proves nothing about anywhere
# else; the check that matters runs ldd inside a bare ubuntu:24.04 container,
# which has no ffmpeg at all.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v"
        required: true

env:
  CORE_REPOSITORY: artur-rios/alexandria-api

  # The same commit ci.yml pins, and it must stay that way — the drift check in
  # ci.yml's analyze job fails the build if the two ever disagree.
  #
  # This tracked `main` until v0.0.1, which meant a tag linked against whatever
  # the core happened to be the morning it was built: two builds of the same tag
  # could ship different cores, and what shipped had never been the thing CI
  # ran the integration suite against. A release is the one place that matters
  # most. Moving this is now the same deliberate act as moving CI's — both
  # values change together, or the build stops.
  CORE_REF: 90e84bdd2d054e659ba82eeab39b7b2e7ba157c6

  # Must match the SDK the committed pubspec.lock was resolved with, for the
  # same reason CI pins it: a newer SDK rewrites the lock during `pub get`, and
  # a release built against dependencies nobody chose is worse here than in CI.
  FLUTTER_VERSION: 3.44.9

  # The LGPL build, not the GPL one CI uses. CI's ffmpeg is a build-time
  # dependency of a binary nobody receives; these packages are distributed, and
  # the GPL variant would carry its terms into what ships. The core is
  # proprietary, so the LGPL shared build is the one whose terms a closed
  # application can meet — by dynamic linking, unmodified, with its licence
  # texts included. Nothing here re-encodes, so the GPL-only encoders that
  # variant adds are not needed anyway.
  #
  # Pinned to the same dated autobuild release CI pins, and for the same
  # reason. This used to point at the `latest` tag, whose assets rotate as new
  # series are cut: it carried a 7.1 build until it did not, and by the first
  # tagged run that tag held only 8.1 and 9.0 and the download 404'd. A dated
  # tag is immutable, so the only way this moves now is somebody moving it.
  #
  # The 7.1 series specifically, not a newer one — see the long note on the
  # equivalent step in ci.yml for why ffmpeg-sys-next cannot build against
  # master's hwcontext headers.
  FFMPEG_WINDOWS_RELEASE: autobuild-2026-08-16-13-00
  FFMPEG_WINDOWS_ARCHIVE: ffmpeg-n7.1.5-16-g9a4bb2c579-win64-lgpl-shared-7.1.zip

  # The libraries a shared ffmpeg build links the core against by name. Listed
  # once so the bundling steps below cannot drift from each other.
  FFMPEG_LIBRARIES: avcodec avdevice avfilter avformat avutil swresample swscale

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries to build. See the CI workflow for why the
      # 7.1 series rather than master.
      - name: Install the ffmpeg development libraries
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_WINDOWS_RELEASE}/${FFMPEG_WINDOWS_ARCHIVE}"
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg > /dev/null
          root=$(find /tmp/ffmpeg -maxdepth 1 -mindepth 1 -type d | head -1)
          test -f "$root/include/libavutil/hwcontext_cuda.h"
          echo "FFMPEG_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          echo "FFMPEG_ROOT_POSIX=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"

          # The MSIX packager accepts only a numeric dotted version and rejects
          # anything else outright. Checked here rather than twenty minutes
          # later, three quarters of the way through the job, which is where a
          # dispatch run with a version like "0.0.2-test" first found out.
          case $version in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::version must be numeric and dotted, such as 1.2.3 — got: $version"
              exit 1
              ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Every package downstream takes its version from the pubspec rather
      # than from the tag: flutter_distributor names the .deb and the AppImage
      # from it, and the application reports it as its own version. Left alone,
      # a v0.0.1 release would carry a file called
      # alexandria_desktop-1.0.0+1-linux.deb and an application that called
      # itself 1.0.0. Stamped here so the tag is the one source of that number.
      #
      # The working copy only — nothing is committed. The pubspec in git keeps
      # the version the project develops against.
      - name: Stamp the version into the pubspec
        shell: bash
        run: |
          set -e
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.value }}+${{ github.run_number }}/"             pubspec.yaml
          grep '^version:' pubspec.yaml

      - run: flutter build windows --release

      # Beside the executable, which is where IR-04's resolver looks first.
      #
      # The ffmpeg libraries travel with it: a shared build links
      # alexandria_ffi.dll against them by name, so without them the package
      # installs and then fails to load the core on first launch — the kind of
      # break that only shows up on a machine that is not a build machine.
      #
      # The installer and the MSIX both take the whole Release directory, so
      # copying here is all it takes to reach every Windows package.
      - name: Bundle the core and its ffmpeg libraries
        shell: bash
        run: |
          set -e
          release=build/windows/x64/runner/Release
          cp core/target/release/alexandria_ffi.dll "$release/"

          for library in $FFMPEG_LIBRARIES; do
            # The soname carries the major version, which moves with ffmpeg, so
            # the file is matched rather than spelled out.
            found=$(find "$FFMPEG_ROOT_POSIX/bin" -name "${library}-*.dll" | head -1)
            test -n "$found" || { echo "::error::no DLL found for $library"; exit 1; }
            cp "$found" "$release/"
          done

          # LGPL obliges the licence texts to travel with the binaries.
          cp -r "$FFMPEG_ROOT_POSIX/LICENSE.txt" "$release/FFMPEG-LICENSE.txt"

      # A package that cannot load the core is the failure this whole step
      # exists to prevent, so it is checked here rather than discovered by
      # whoever installs it.
      - name: Verify every linked library is present
        shell: bash
        run: |
          set -e
          release=build/windows/x64/runner/Release
          missing=0
          for library in $FFMPEG_LIBRARIES; do
            ls "$release/${library}-"*.dll > /dev/null 2>&1 || {
              echo "::error::$library is missing from the Windows bundle"
              missing=1
            }
          done
          test -f "$release/alexandria_ffi.dll" || {
            echo "::error::alexandria_ffi.dll is missing from the Windows bundle"
            missing=1
          }
          exit $missing

      # For running the application without installing it. Deliberately placed
      # after the verification above and before the MSIX below: after, so the
      # archive cannot ship without the core and its ffmpeg libraries; before,
      # because `msix:create` writes its output into this same directory and
      # the portable archive has no business carrying a copy of the MSIX.
      - name: Build the portable archive
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # 7z is a native Windows program, so it gets a Windows path. Zipping
          # from inside the directory is what keeps the archive's entries at
          # its root rather than nested under build/windows/x64/runner.
          zip="$(cygpath -w "$PWD/dist/alexandria-${{ steps.version.outputs.value }}-windows-x64.zip")"
          (cd build/windows/x64/runner/Release && 7z a -tzip "$zip" '*' -x'!*.msix' > /dev/null)

          # The archive is the application, not a container for other
          # packages. Belt and braces alongside the -x above and the Excludes
          # in installer.iss: this directory is where msix:create writes, and
          # an archive carrying a second copy of the whole application is the
          # kind of thing nobody notices except as a suspicious download size.
          if 7z l "$zip" | grep -q '\.msix$'; then
            echo "::error::the portable archive picked up an MSIX"
            exit 1
          fi
          7z l "$zip" | tail -20

      - name: Build the MSIX package
        run: dart run msix:create --version ${{ steps.version.outputs.value }}.0

      - name: Build the installer
        env:
          ALEXANDRIA_VERSION: ${{ steps.version.outputs.value }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/windows/x64/runner/Release/*.msix
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Debian's libav* are the LGPL builds; libavcodec-extra is the GPL one and
      # is deliberately not used here, for the reason given on
      # FFMPEG_WINDOWS_BUILD above.
      - name: Install the ffmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev \
            libswresample-dev pkg-config clang

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev \
            libmpv-dev mpv \
            flatpak flatpak-builder \
            libfuse2 fakeroot patchelf
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      # flutter_distributor's AppImage maker shells out to `appimagetool` and
      # does not supply it — the first tagged run failed with a bare
      # "appimagetool: not found" after the .deb had already been built.
      #
      # Unpacked rather than run as an AppImage. Mounting one needs FUSE, which
      # a runner may or may not give a process, and `--appimage-extract` sides
      # step that entirely: what ends up on PATH is a plain wrapper around the
      # extracted AppRun.
      - name: Install appimagetool
        run: |
          set -e
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract > /dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          # ARCH is defaulted in the wrapper rather than exported into the
          # job: appimagetool refuses to guess the architecture, and
          # flutter_distributor invokes it through /bin/sh with an environment
          # this workflow does not control.
          sudo tee /usr/local/bin/appimagetool > /dev/null <<'WRAPPER'
          #!/bin/sh
          exec env ARCH="${ARCH:-x86_64}" /opt/appimagetool/AppRun "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/appimagetool

          # Proves the wrapper actually executes, here rather than four steps
          # later inside a packaging tool's stack trace.
          appimagetool --help > /dev/null

      - run: flutter pub get

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"

          # The MSIX packager accepts only a numeric dotted version and rejects
          # anything else outright. Checked here rather than twenty minutes
          # later, three quarters of the way through the job, which is where a
          # dispatch run with a version like "0.0.2-test" first found out.
          case $version in
            *[!0-9.]* | "" | .* | *.)
              echo "::error::version must be numeric and dotted, such as 1.2.3 — got: $version"
              exit 1
              ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Every package downstream takes its version from the pubspec rather
      # than from the tag: flutter_distributor names the .deb and the AppImage
      # from it, and the application reports it as its own version. Left alone,
      # a v0.0.1 release would carry a file called
      # alexandria_desktop-1.0.0+1-linux.deb and an application that called
      # itself 1.0.0. Stamped here so the tag is the one source of that number.
      #
      # The working copy only — nothing is committed. The pubspec in git keeps
      # the version the project develops against.
      - name: Stamp the version into the pubspec
        shell: bash
        run: |
          set -e
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.value }}+${{ github.run_number }}/"             pubspec.yaml
          grep '^version:' pubspec.yaml

      # Into native/linux, before the build, rather than into the bundle after
      # it. linux/CMakeLists.txt installs this directory into the bundle, and
      # every `flutter build linux` wipes and reassembles that bundle — so a
      # copy made afterwards lasts only until the next build. flutter_distributor
      # runs a build per package, which is how the v0.0.1 .deb, AppImage, and
      # Flatpak all shipped without the core in them.
      - name: Stage the core for the build
        run: |
          set -e
          mkdir -p native/linux
          cp core/target/release/libalexandria_ffi.so native/linux/

      - run: flutter build linux --release

      - name: Verify the build produced a complete bundle
        run: |
          set -e
          test -f build/linux/x64/release/bundle/lib/libalexandria_ffi.so || {
            echo "::error::the build did not install the core into the bundle"
            exit 1
          }
          echo "The core is in the bundle, installed by the build itself."

      # Records what the core needs at runtime, so a package that cannot load
      # it is diagnosable from the build log rather than only from a user's
      # machine. Deliberately not a gate: every library resolves here because
      # this runner installed them to build the core, so passing would say
      # nothing about the machine the package lands on.
      - name: Report the core's runtime dependencies
        run: |
          echo "Libraries libalexandria_ffi.so needs at runtime:"
          ldd build/linux/x64/release/bundle/lib/libalexandria_ffi.so \
            | grep -E "libav|libsw" || true

      # ORDER MATTERS BELOW, and this is why.
      #
      # Two of the five Linux packages get ffmpeg from somewhere else: the .deb
      # declares the distribution's packages as Depends, and the Flatpak mounts
      # the ffmpeg-full runtime extension. The other three — the tarball, the
      # installer, and the AppImage — carry their own copies, because they have
      # nobody to ask.
      #
      # All five are built from build/linux/x64/release/bundle. So the two that
      # must not contain ffmpeg are built first, from the pristine bundle, and
      # only then is ffmpeg bundled into it for the three that must.

      - name: Build the .deb
        run: |
          set -e
          # Debian's Installed-Size is in kilobytes, measured here rather than
          # maintained by hand in the config where it would be wrong from the
          # first build that changed the bundle's size.
          size=$(du -sk build/linux/x64/release/bundle | cut -f1)
          sed -i "s/^installed_size: .*/installed_size: ${size}/" \
            linux/packaging/deb/make_config.yaml
          grep '^installed_size:' linux/packaging/deb/make_config.yaml

          dart pub global activate flutter_distributor
          flutter_distributor package \
            --platform linux --targets deb \
            --skip-clean

      # Installing it is the only honest test of a dependency list: dpkg-deb
      # will happily build a package naming libraries that do not exist, and
      # the failure would surface on somebody's machine at install time. apt
      # resolves the names here instead. The runner is 24.04, which is the
      # release the Depends list targets.
      - name: Verify the .deb installs and carries the core
        run: |
          set -e
          package=$(find dist -name '*.deb' | head -1)
          test -n "$package"
          echo "Package: $package"
          dpkg-deb --info "$package" | sed -n '/Depends/p'

          echo "::group::Contents"
          dpkg-deb --contents "$package" | grep -E 'alexandria_ffi|libav|libsw' || true
          echo "::endgroup::"

          # The core must be inside. flutter_distributor re-runs `flutter build`
          # for every target, so anything copied into the bundle beforehand is
          # only still there if that rebuild left it alone — which is exactly
          # the assumption worth checking rather than trusting.
          dpkg-deb --contents "$package" | grep -q 'libalexandria_ffi[.]so' || {
            echo "::error::the .deb does not contain the core"
            exit 1
          }

          # And ffmpeg must not be, or the bundled copy would shadow the
          # system's and then go unpatched.
          if dpkg-deb --contents "$package" | grep -qE 'lib(av|sw)[a-z]+[.]so'; then
            echo "::error::the .deb carries ffmpeg; it is supposed to depend on it"
            exit 1
          fi

          sudo apt-get install -y "./$package"
          test -x /opt/alexandria_desktop/alexandria_desktop
          sudo apt-get remove -y alexandria

      # Taken now, while the bundle is still pristine. The Flatpak is built at
      # the end of the job, by which point the directory it would otherwise
      # copy has ffmpeg in it.
      - name: Set the Flatpak's source aside
        run: cp -r build/linux/x64/release/bundle packaging/linux/bundle

      # From here on the bundle carries ffmpeg. See the script for how the
      # dependency closure is computed and what is deliberately left to the
      # host.
      - name: Bundle ffmpeg for the portable packages
        run: |
          sh packaging/linux/bundle-libraries.sh \n            build/linux/x64/release/bundle native/linux

      # The step above wrote into the build's input, not its output, so the
      # bundle does not have ffmpeg in it until a build puts it there. This
      # rebuild is what every package produced from here on picks up — and,
      # because flutter_distributor rebuilds again for the AppImage, what that
      # picks up too.
      - name: Rebuild with ffmpeg in the bundle
        run: |
          set -e
          flutter build linux --release
          ls build/linux/x64/release/bundle/lib/libavcodec.so.* > /dev/null || {
            echo "::error::the rebuild did not install ffmpeg into the bundle"
            exit 1
          }

      # A bundle is only self-contained if it is self-contained somewhere that
      # is not the machine that built it. This runner installed ffmpeg to
      # compile the core, so resolving here proves nothing — a bare container
      # has no ffmpeg, which is the entire point of using one.
      # The claim being made is "plug and play": unpack it on a machine that has
      # a desktop and nothing else, and it runs. So that is what is tested — a
      # container with only GTK installed, which is what host-libraries.txt
      # assumes is present, and nothing else the application needs.
      #
      # The executable as well as the core, because Flutter links its plugins
      # into the executable: a missing libmpv there is not a program that
      # cannot play video, it is a program that cannot start. Checking only the
      # core is how that went unnoticed.
      #
      # The runner itself proves nothing — it installed ffmpeg, libmpv, and GTK
      # in order to build this.
      - name: Verify the bundle runs on a machine with only a desktop
        run: |
          set -e
          bundle="$PWD/build/linux/x64/release/bundle"

          echo "::group::Resolution inside ubuntu:24.04 with only GTK added"
          docker run --rm -v "$bundle:/bundle:ro" ubuntu:24.04 sh -c '
            set -e
            apt-get update -qq > /dev/null
            apt-get install -y -qq libgtk-3-0t64 > /dev/null
            echo "--- executable ---"
            ldd /bundle/alexandria_desktop 2>&1
            echo "--- core ---"
            ldd /bundle/lib/libalexandria_ffi.so 2>&1
          ' | tee /tmp/ldd.txt
          echo "::endgroup::"

          if grep -q "not found" /tmp/ldd.txt; then
            echo "::error::the bundle does not resolve on a machine with only a desktop"
            echo "Unresolved:"
            grep "not found" /tmp/ldd.txt | sort -u
            exit 1
          fi

          echo "The executable and the core resolve every library they need."

      # Staged rather than assembled in place, so the desktop entry and the
      # icon the installer needs do not also end up as stray files inside the
      # AppImage. The archive is what the installer extracts, so the two carry
      # byte-for-byte the same payload.
      - name: Build the portable archive
        run: |
          set -e
          mkdir -p dist stage
          cp -r build/linux/x64/release/bundle/. stage/
          cp packaging/linux/io.github.artur_rios.Alexandria.desktop stage/
          cp packaging/linux/io.github.artur_rios.Alexandria.png stage/

          ls stage/lib/libavcodec.so.* > /dev/null || {
            echo "::error::the portable archive would ship without ffmpeg"
            exit 1
          }

          tar czf \
            "dist/alexandria-${{ steps.version.outputs.value }}-linux-x64.tar.gz" \
            -C stage .

      # The head is a complete shell script that ends in the payload marker;
      # concatenating the archive onto it is the whole of what makes it
      # self-extracting. The version is substituted here so the script can
      # report it without the workflow having to pass it in at run time.
      - name: Build the self-extracting installer
        run: |
          set -e
          version="${{ steps.version.outputs.value }}"
          installer="dist/alexandria-installer-${version}-linux-x64.sh"

          sed "s/@VERSION@/${version}/" packaging/linux/install.sh > /tmp/head.sh
          cat /tmp/head.sh "dist/alexandria-${version}-linux-x64.tar.gz" > "$installer"
          chmod +x "$installer"

      # An installer that cannot install is the failure this checks for, and it
      # is cheap enough to check here rather than leave for whoever downloads
      # it. Runs the three paths that matter: a fresh install, a replacement of
      # that install, and removal.
      - name: Smoke-test the installer
        run: |
          set -e
          version="${{ steps.version.outputs.value }}"
          installer="dist/alexandria-installer-${version}-linux-x64.sh"
          prefix="$RUNNER_TEMP/alexandria-smoke"

          "./$installer" --prefix "$prefix" --yes
          test -x "$prefix/alexandria_desktop"
          test -f "$prefix/lib/libalexandria_ffi.so"
          test -f "$HOME/.local/share/icons/hicolor/512x512/apps/io.github.artur_rios.Alexandria.png"

          # What the installer places must be as self-contained as what it came
          # from, licences included.
          ls "$prefix"/lib/libavcodec.so.* > /dev/null
          test -f "$prefix/lib/licenses/README.txt"

          # A file the installer did not write must survive the replacement
          # below, which is the whole point of removing recorded paths rather
          # than the directory.
          echo "not ours" > "$prefix/unrelated.txt"

          "./$installer" --prefix "$prefix" --yes
          test -x "$prefix/alexandria_desktop"
          test -f "$prefix/unrelated.txt"

          "./$installer" --uninstall --yes
          test ! -e "$prefix/alexandria_desktop"
          test -f "$prefix/unrelated.txt"

          rm -rf "$prefix"

      # From the same staged payload the tarball is made from, so the two carry
      # identical contents and whatever is verified for one holds for the
      # other. See the script for why flutter_distributor's AppImage maker is
      # not used for this.
      - name: Build the AppImage
        run: |
          set -e
          sh packaging/linux/build-appimage.sh stage \
            "dist/alexandria-${{ steps.version.outputs.value }}-linux-x86_64.AppImage"

      # Unpacked and inspected rather than trusted. The AppImage is assembled
      # from the staged payload, so this also confirms that what was staged is
      # what came out the other side.
      - name: Verify the AppImage carries ffmpeg
        run: |
          set -e
          image=$(find dist -name '*.AppImage' | head -1)
          test -n "$image"
          chmod +x "$image"

          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract > /dev/null)

          found=$(find "$RUNNER_TEMP/squashfs-root" -name 'libavcodec.so.*' | head -1)
          test -n "$found" || {
            echo "::error::the AppImage does not carry ffmpeg"
            exit 1
          }
          echo "AppImage carries $(basename "$found")"

          find "$RUNNER_TEMP/squashfs-root" -name 'libalexandria_ffi.so' | head -1
          rm -rf "$RUNNER_TEMP/squashfs-root"

      # Built from the copy set aside before the bundling step, so it carries
      # no ffmpeg of its own — it mounts the ffmpeg-full extension instead,
      # which is what the manifest's add-extensions block arranges.
      - name: Build the Flatpak
        run: |
          set -e
          flatpak-builder --repo=packaging/linux/repo --force-clean \
            packaging/linux/build \
            packaging/linux/io.github.artur_rios.Alexandria.yaml
          flatpak build-bundle packaging/linux/repo \
            "dist/alexandria-${{ steps.version.outputs.value }}.flatpak" \
            io.github.artur_rios.Alexandria

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
            dist/alexandria-installer-*.sh
          if-no-files-found: error

  # A tag, and only a tag. workflow_dispatch has no tag to release against, so
  # a manual run stops at the artifacts above — which is what makes it usable
  # for checking that the packaging still builds without publishing anything.
  release:
    name: GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve the version
        id: version
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

          # A 0.x release is not a release anyone should mistake for the
          # product being finished, so it is flagged as a prerelease and does
          # not become the repository's "latest".
          case $version in
            0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Both jobs' artifacts arrive as directory trees — flutter_distributor
      # nests its output under a version directory — so the assets are gathered
      # by extension rather than by path.
      - name: Collect the assets
        run: |
          set -e
          mkdir -p release
          find artifacts -type f \( \
              -name '*.exe' -o -name '*.msix' -o -name '*.zip' \
              -o -name '*.deb' -o -name '*.AppImage' -o -name '*.flatpak' \
              -o -name '*.tar.gz' -o -name '*.sh' \
            \) -exec cp -n {} release/ \;

          # An empty release is a failed release that looks like a successful
          # one, and a tag can only be published once.
          count=$(find release -type f | wc -l)
          test "$count" -gt 0 || {
            echo "::error::no assets were collected from the build artifacts"
            exit 1
          }

          echo "Publishing $count assets:"
          ls -lh release

      # `body` is prepended to the notes GitHub generates from the commits.
      # Written here rather than left to whoever cuts the release: v0.0.1
      # published eight files, explained none of them, and its notes were the
      # entire project's pull request history and nothing else. What a release
      # page most needs to say is which file to download and what it needs.
      - uses: softprops/action-gh-release@v2
        with:
          name: Alexandria ${{ steps.version.outputs.value }}
          body: |
            Every package below carries the Alexandria core, and every one that
            cannot ask a package manager for ffmpeg carries that too. There is
            nothing else to install.

            ## Windows

            - **`alexandria-setup-${{ steps.version.outputs.value }}.exe`** —
              the installer. Asks where to install, and replaces an existing
              installation found there or in the place a previous install
              recorded. Only the program's own files are removed; your library,
              catalog, and settings are left alone.
            - **`alexandria-${{ steps.version.outputs.value }}-windows-x64.zip`**
              — the application itself. Unpack it and run
              `alexandria_desktop.exe`; nothing is registered, and deleting the
              folder removes it.
            - **`alexandria.msix`** — published unsigned. Windows will not
              install an unsigned MSIX without a trusted certificate, so use
              the installer unless you have your own signing set up.

            ## Linux

            - **`alexandria-installer-${{ steps.version.outputs.value }}-linux-x64.sh`**
              — the installer. `chmod +x` it and run it. Defaults to
              `~/.local/share/alexandria`, or `/opt/alexandria` as root, and
              replaces an existing installation the same way the Windows one
              does. `--prefix DIR` and `--yes` skip the questions;
              `--uninstall` removes what it installed and nothing else.
            - **`alexandria-${{ steps.version.outputs.value }}-linux-x64.tar.gz`**
              — the application itself. Unpack it and run
              `./alexandria_desktop`.
            - **`.deb`** — for Ubuntu 24.04, which is the release it is built
              on. Pulls ffmpeg, libmpv, and GTK in through apt.
            - **`.AppImage`** — carries everything it needs.
            - **`.flatpak`** — its codecs come from the
              `org.freedesktop.Platform.ffmpeg-full` runtime extension.

            The installer, the tarball, and the AppImage bundle ffmpeg and the
            libraries it depends on; their licences are in `lib/licenses`. Only
            the graphics, sound, and C libraries any desktop application needs
            come from your system.

            Packages are unsigned — code signing needs a certificate the
            project does not hold yet.

          files: release/*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
