# IR-15: the unit and widget suite, the integration suite, and the release build on Windows, the platform Jenkins
# cannot run. The Linux half of each (and the analysis, which is not platform-dependent) is a Jenkins check now:
# yggdrasil.yml, ci/analyze.sh, ci/test.sh, ci/integration.sh and ci/build.sh.
#
# A fourth job, `Sandboxed page engine (linux)`, runs the one integration test Jenkins' containers cannot: the page viewer's
# real Chromium sandbox (see below).
#
# These jobs are the catalog's actionsChecks, required on develop under the names below; the first three are exactly as
# GitHub reported them when each was a matrix of two legs. The pull requests live on Forgejo and the GitHub copy is a
# mirror that only receives pushes, so they run on a push to any branch, and on nothing narrower: Jenkins finds a job's run
# for a pull request's head commit by its SHA and copies the result, and a commit a filter skipped would have no run, so its
# status would stay pending.
#
# There is no "known warnings" list for the analysis (Operations & Infrastructure Document §7.1), and none here.

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Windows ffmpeg development libraries, pinned. The 7.1 series
  # specifically — see the comment on the install step for why a newer one
  # does not build.
  FFMPEG_RELEASE: autobuild-2026-07-31-14-10
  FFMPEG_ARCHIVE: ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-shared-7.1.zip

jobs:
  test:
    # Both platforms ran this suite, and the goldens are why. The shell goldens
    # hold text, and text is the one thing a renderer does differently on each
    # operating system — a golden made on one and only ever checked on the
    # other is a golden nobody is checking. That is not hypothetical here: this
    # suite was red on Linux for three days while passing on the machine the
    # goldens came from, because nothing ran it on both.
    #
    # The Linux half is the `test` check on Jenkins (ci/test.sh).
    name: Unit and widget tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The versions come from ci/pins.sh, the file the Jenkins checks read:
      # Flutter, and the commit of the core.
      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
            echo "RUST_VERSION=$RUST_VERSION"
          } >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # IR-11: a key present in one language and absent from the other fails the
      # build. The parity test in test/core/l10n is what enforces it, and it
      # runs as part of the suite below rather than in a run of its own first.
      # The same script as the Linux leg (ci/test.sh): the suite in four
      # bundles, compiled once each, rather than one entry point per file.
      - name: Test with coverage (localization parity included)
        shell: bash
        run: bash ci/unit-suite.sh

  integration:
    name: Integration (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
            echo "RUST_VERSION=$RUST_VERSION"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      # The toolchain of ci/pins.sh, the one the Jenkins checks build the core with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries at build time. The core builds on Linux
      # only in its own repository's workflow, so the Windows half below is this
      # repository's to carry.
      #
      # ffmpeg-sys-next has no pkg-config to find on Windows, so it is pointed
      # at an unpacked release build through FFMPEG_DIR. The shared variant is
      # the one that ships headers and import libraries, and its bin directory
      # goes on PATH: a shared build links the core against avcodec, avformat,
      # avutil, avfilter, avdevice, swscale, and swresample by name, and
      # without them the core builds and then fails to load — which surfaces as
      # an unrelated-looking "core could not be loaded".
      #
      # The 7.1 series, not master. ffmpeg-sys-next binds the hwcontext headers
      # without the vendor SDKs by stubbing them, and its CUDA stub declares
      # only CUcontext and CUstream. FFmpeg 7.1's hwcontext_cuda.h needs
      # exactly those; master's added fields typed CUarray and
      # CUDA_ARRAY3D_DESCRIPTOR, which the stub does not declare, so bindgen
      # fails on a header it cannot parse. A newer ffmpeg needs a version of
      # that crate that knows about it.
      #
      # Pinned to a dated autobuild release rather than the `latest` tag,
      # whose assets rotate as new series are cut: it carried a 7.1 build until
      # it did not, and the download then 404'd on every pull request with
      # nothing in this repository having changed.
      #
      # A dated tag is not immutable either, though — the daily ones are pruned
      # after a few weeks, and the pin then 404s the same way. That is what the
      # fallback below is for: it finds the newest release still carrying a 7.1
      # shared build and says which one it used, so CI keeps running and the
      # drift is visible in the log rather than as a red job nobody caused. The
      # pin itself is a month-end release, which is kept far longer.
      #
      # The unpacked directory carries the exact build in its name, so it is
      # discovered rather than spelled out.
      - name: Install the ffmpeg development libraries
        shell: bash
        # For the fallback's `gh api` call only; the pinned download needs no
        # credential.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download
          if ! curl -fsSL -o /tmp/ffmpeg.zip \
            "$base/${FFMPEG_RELEASE}/${FFMPEG_ARCHIVE}"; then
            echo "::warning::${FFMPEG_RELEASE} no longer carries ${FFMPEG_ARCHIVE}; falling back to the newest release that has a 7.1 shared build."
            url=$(gh api repos/BtbN/FFmpeg-Builds/releases --paginate \
              --jq '.[] | .assets[] | select(.name | test("win64-gpl-shared-7\\.1\\.zip$")) | .browser_download_url' \
              | head -1)
            test -n "$url"
            echo "::notice::using $url"
            curl -fsSL -o /tmp/ffmpeg.zip "$url"
          fi
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg > /dev/null
          root=$(find /tmp/ffmpeg -maxdepth 1 -mindepth 1 -type d | head -1)
          test -f "$root/include/libavutil/hwcontext_cuda.h"
          echo "FFMPEG_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - name: Bundle the core
        shell: bash
        run: |
          mkdir -p native/windows
          cp core/target/release/alexandria_ffi.dll native/windows/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Integration suite
        shell: bash
        # The same script as the Linux leg (ci/integration.sh): every file in
        # one launch of the application, and the page engine's file in a
        # second. Each `flutter test` on desktop builds and starts the
        # application again, and the second file of one invocation fails to
        # launch, so the files are gathered into one generated entry point
        # rather than looped over one invocation each.
        #
        # ALEXANDRIA_AUTH_MODE is deliberately not set. The application puts
        # the core into local auth mode itself, before initializing it, and a
        # runner that set the variable would hide a regression in that: the
        # suite would pass on the runner's configuration rather than on the
        # application's.
        run: bash ci/integration-suite.sh windows

  build:
    name: Release build (windows)
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Windows needs no equivalent of the Linux desktop toolchain:
      # media_kit_libs_video ships the native libraries there.
      - run: flutter pub get

      - run: flutter build windows --release

      # The setup, staged (update-check design §3 step 4): a silent install; a replacement in the update mode the
      # application uses, which must keep a file the setup did not write and leave no staging behind; and a replacement
      # that fails part-way — a DLL held open with no sharing, so it cannot be moved — which must leave the previous
      # files exactly as they were; then an uninstall, which must leave only that unrelated file. Compiled on every push
      # rather than only at release time, so a broken setup script fails here first. Each run is waited for by itself:
      # Start-Process -Wait would also wait for the application the update starts again.
      - name: Installer smoke test
        shell: pwsh
        timeout-minutes: 15
        env:
          ALEXANDRIA_VERSION: 0.0.0
        run: |
          $ErrorActionPreference = 'Stop'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'the setup did not compile' }
          $setup = (Resolve-Path 'dist\alexandria-setup-0.0.0.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'Alexandria Smoke'
          function Run-Setup([string[]] $arguments, [string] $log) {
            $all = $arguments + '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", "/LOG=`"$log`""
            $process = Start-Process $setup -ArgumentList $all -PassThru
            # Opened now, or ExitCode reads as nothing once the process is gone.
            $null = $process.Handle
            $process.WaitForExit()
            Get-Content $log -ErrorAction SilentlyContinue | Select-String 'staged|could not|kept|set aside|nothing was changed' | Out-Host
            return $process.ExitCode
          }
          # An update starts the application again; it has nothing to do here, and holding its files it would stop the
          # next run. Given up to ten seconds to appear.
          function Stop-App {
            for ($i = 0; $i -lt 20 -and -not (Get-Process alexandria -ErrorAction SilentlyContinue); $i++) {
              Start-Sleep -Milliseconds 500
            }
            Get-Process alexandria -ErrorAction SilentlyContinue | Stop-Process -Force -PassThru | Wait-Process -Timeout 30
          }
          function Entries { Get-ChildItem -LiteralPath $dir -Recurse -Force | ForEach-Object { $_.FullName } | Sort-Object }
          # Any process with a file of the installation loaded — the executable or a library — which the setup
          # should have waited for.
          function Show-Holders([string] $when) {
            $holders = @(Get-Process | Where-Object {
              try { @($_.Modules | Where-Object { $_.FileName -like "$dir\*" }).Count -gt 0 } catch { $false }
            })
            foreach ($holder in $holders) {
              $info = Get-CimInstance Win32_Process -Filter "ProcessId = $($holder.Id)"
              "holding the installation ($when): $($holder.Id) $($holder.Path) started $($holder.StartTime) by $($info.ParentProcessId): $($info.CommandLine)" | Out-Host
            }
          }

          $code = Run-Setup @('/VERYSILENT') "$env:RUNNER_TEMP\install.log"
          if ($code -ne 0) { throw "the first install exited with $code" }
          if (-not (Test-Path "$dir\alexandria.exe")) { throw 'the first install placed no executable' }
          Set-Content "$dir\unrelated.txt" 'not ours'

          Show-Holders 'before the update'
          $code = Run-Setup @('/SILENT', '/UPDATE') "$env:RUNNER_TEMP\update.log"
          Show-Holders 'after the update'
          Stop-App
          if ($code -ne 0) { throw "the update exited with $code" }
          if (-not (Select-String -Quiet -Path "$env:RUNNER_TEMP\update.log" -Pattern 'the staged files were moved into place')) {
            throw 'the update did not move the staged files into place'
          }
          foreach ($path in "$dir\alexandria.exe", "$dir\unrelated.txt") {
            if (-not (Test-Path $path)) { throw "missing after the update: $path" }
          }
          # What a leftover holds, and its attributes, say why it stayed.
          function Assert-Gone([string] $path) {
            if (Test-Path $path) {
              Get-ChildItem -LiteralPath $path -Recurse -Force | Select-Object FullName, Attributes | Format-Table -AutoSize | Out-Host
              throw "left behind: $path"
            }
          }
          foreach ($path in "$dir\.staging-update", "$dir\.backup-update") { Assert-Gone $path }
          Get-ChildItem -LiteralPath $dir -Filter '.stale-update-*' -Force | ForEach-Object { Assert-Gone $_.FullName }

          $before = Entries
          $held = Get-ChildItem -LiteralPath $dir -Filter '*.dll' | Select-Object -Last 1
          $handle = [IO.File]::Open($held.FullName, 'Open', 'Read', 'None')
          try {
            $code = Run-Setup @('/SILENT', '/UPDATE') "$env:RUNNER_TEMP\failed.log"
          } finally {
            $handle.Dispose()
          }
          Stop-App
          if (-not (Select-String -Quiet -Path "$env:RUNNER_TEMP\failed.log" -Pattern 'could not be moved into place')) {
            throw "the update with $($held.Name) held open did not fail as it should"
          }
          $after = Entries
          $changed = Compare-Object $before $after
          if ($changed) { $changed | Out-Host; throw 'the failed update changed the previous installation' }
          if (-not (Test-Path "$dir\.alexandria-payload")) { throw 'the update recorded no payload' }

          # Uninstalling removes every entry the swap put in place — the uninstall log names only their staging paths —
          # and keeps the file the setup did not write. The uninstaller hands over to a copy of itself and returns at once;
          # unins000.exe disappearing is what says it finished.
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path "$dir\unins000.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          $left = @(Get-ChildItem -LiteralPath $dir -Force | ForEach-Object { $_.Name })
          if (($left.Count -ne 1) -or ($left[0] -ne 'unrelated.txt')) {
            throw "uninstall left: $($left -join ', ')"
          }

  # integration_test/viewers/saved_page_engine_test.dart opens a hostile saved page in the real Chromium engine and asserts
  # on what its script managed to do (UC-25, FR-VW-05, NFR-12): web security on, the sandbox on, the page held to its folder.
  # That is a security gate, and it cannot run in Jenkins: its checks run as container root, where the engine must refuse to
  # start and the test is skipped, and a container's seccomp profile forbids the user namespaces Chromium's sandbox needs.
  # So it runs here, on a throw-away runner, the way the old Linux integration job ran it. The rest of the Linux integration
  # suite is the `integration` check (ci/integration.sh).
  sandboxed-page-engine:
    name: Sandboxed page engine (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
            echo "RUST_VERSION=$RUST_VERSION"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      # The toolchain of ci/pins.sh, the one the Jenkins checks build the core with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries at build time. The package list mirrors
      # the core repository's own workflow.
      - name: Install the ffmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev \
            libswresample-dev pkg-config clang

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - name: Bundle the core
        run: |
          mkdir -p native/linux
          cp core/target/release/libalexandria_ffi.so native/linux/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # libmpv is media_kit_video's build-time dependency on Linux: its
      # CMakeLists links PkgConfig::mpv, and without the development package
      # the desktop build fails at the generate step rather than at link time
      # (UC-19).
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          # libnss3 / libnspr4: the page viewer's browser engine (webview_cef)
          # links against them, and the runner does not carry them by default.
          # libx11-dev / libxi-dev: nativeapi's build hook (window_manager,
          # screen_retriever) compiles its core against them.
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev \
            xvfb libmpv-dev mpv libnss3 libnspr4

      - run: flutter pub get

      # The page engine runs only inside Chromium's sandbox, and refuses to
      # start without one (third_party/webview_cef/FORK.md). On Linux the
      # sandbox needs unprivileged user namespaces, which Ubuntu 23.10+
      # restricts through AppArmor by default. Lifted here, on a throwaway
      # runner, so that the test exercises the real sandboxed engine rather
      # than its refusal.
      - name: Let Chromium create its sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The hostile-page test, by name. The file's other test is the refusal
      # test, which is skipped on purpose here (it runs only where the engine
      # cannot start). If the sandbox cannot be created on this runner the
      # hostile-page test FAILS ("the page engine refused to start"); the check
      # below makes sure a skip cannot pass for a run either: this job must
      # have run the engine. The reporter is named because on GitHub Actions
      # flutter test picks the github one, whose summary ("🎉 1 test passed.")
      # the check would not recognise.
      - name: Hostile saved page against the sandboxed engine
        run: |
          set -o pipefail
          xvfb-run -a flutter test integration_test/viewers/saved_page_engine_test.dart -d linux --reporter expanded \
            --plain-name GivenAHostileSavedPage_WhenTheEngineRunsIt_ThenItReadsNoLocalFileAndStaysInItsFolder \
            | tee engine-test.log
          if ! grep -q '+1: All tests passed!' engine-test.log || grep -Eq '~[0-9]|All tests skipped' engine-test.log; then
            echo "::error::the hostile-page test did not run and pass; the sandboxed engine was not exercised"
            exit 1
          fi
