# IR-15: the unit and widget suite, the integration suite, and the release build on Windows, the platform Jenkins
# cannot run. The Linux half of each (and the analysis, which is not platform-dependent) is a Jenkins check now:
# yggdrasil.yml, ci/analyze.sh, ci/test.sh, ci/integration.sh and ci/build.sh.
#
# These three jobs are the catalog's actionsChecks, required on develop under the names below, exactly as GitHub reported
# them when each was a matrix of two legs. The pull requests live on Forgejo and the GitHub copy is a mirror that only
# receives pushes, so they run on a push to any branch, and on nothing narrower: Jenkins finds a job's run for a pull
# request's head commit by its SHA and copies the result, and a commit a filter skipped would have no run, so its status
# would stay pending.
#
# There is no "known warnings" list for the analysis (Operations & Infrastructure Document §7.1), and none here.

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Windows ffmpeg development libraries, pinned. The 7.1 series
  # specifically — see the comment on the install step for why a newer one
  # does not build.
  FFMPEG_RELEASE: autobuild-2026-07-31-14-10
  FFMPEG_ARCHIVE: ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-shared-7.1.zip

jobs:
  test:
    # Both platforms ran this suite, and the goldens are why. The shell goldens
    # hold text, and text is the one thing a renderer does differently on each
    # operating system — a golden made on one and only ever checked on the
    # other is a golden nobody is checking. That is not hypothetical here: this
    # suite was red on Linux for three days while passing on the machine the
    # goldens came from, because nothing ran it on both.
    #
    # The Linux half is the `test` check on Jenkins (ci/test.sh).
    name: Unit and widget tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The versions come from ci/pins.sh, the file the Jenkins checks read:
      # Flutter, and the commit of the core.
      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
          } >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # IR-11: a key present in one language and absent from the other fails the
      # build. The parity test in test/core/l10n is what enforces it.
      - name: Localization parity
        run: flutter test test/core/l10n

      - name: Test with coverage
        run: flutter test --coverage

  integration:
    name: Integration (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries at build time. The core builds on Linux
      # only in its own repository's workflow, so the Windows half below is this
      # repository's to carry.
      #
      # ffmpeg-sys-next has no pkg-config to find on Windows, so it is pointed
      # at an unpacked release build through FFMPEG_DIR. The shared variant is
      # the one that ships headers and import libraries, and its bin directory
      # goes on PATH: a shared build links the core against avcodec, avformat,
      # avutil, avfilter, avdevice, swscale, and swresample by name, and
      # without them the core builds and then fails to load — which surfaces as
      # an unrelated-looking "core could not be loaded".
      #
      # The 7.1 series, not master. ffmpeg-sys-next binds the hwcontext headers
      # without the vendor SDKs by stubbing them, and its CUDA stub declares
      # only CUcontext and CUstream. FFmpeg 7.1's hwcontext_cuda.h needs
      # exactly those; master's added fields typed CUarray and
      # CUDA_ARRAY3D_DESCRIPTOR, which the stub does not declare, so bindgen
      # fails on a header it cannot parse. A newer ffmpeg needs a version of
      # that crate that knows about it.
      #
      # Pinned to a dated autobuild release rather than the `latest` tag,
      # whose assets rotate as new series are cut: it carried a 7.1 build until
      # it did not, and the download then 404'd on every pull request with
      # nothing in this repository having changed.
      #
      # A dated tag is not immutable either, though — the daily ones are pruned
      # after a few weeks, and the pin then 404s the same way. That is what the
      # fallback below is for: it finds the newest release still carrying a 7.1
      # shared build and says which one it used, so CI keeps running and the
      # drift is visible in the log rather than as a red job nobody caused. The
      # pin itself is a month-end release, which is kept far longer.
      #
      # The unpacked directory carries the exact build in its name, so it is
      # discovered rather than spelled out.
      - name: Install the ffmpeg development libraries
        shell: bash
        # For the fallback's `gh api` call only; the pinned download needs no
        # credential.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download
          if ! curl -fsSL -o /tmp/ffmpeg.zip \
            "$base/${FFMPEG_RELEASE}/${FFMPEG_ARCHIVE}"; then
            echo "::warning::${FFMPEG_RELEASE} no longer carries ${FFMPEG_ARCHIVE}; falling back to the newest release that has a 7.1 shared build."
            url=$(gh api repos/BtbN/FFmpeg-Builds/releases --paginate \
              --jq '.[] | .assets[] | select(.name | test("win64-gpl-shared-7\\.1\\.zip$")) | .browser_download_url' \
              | head -1)
            test -n "$url"
            echo "::notice::using $url"
            curl -fsSL -o /tmp/ffmpeg.zip "$url"
          fi
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg > /dev/null
          root=$(find /tmp/ffmpeg -maxdepth 1 -mindepth 1 -type d | head -1)
          test -f "$root/include/libavutil/hwcontext_cuda.h"
          echo "FFMPEG_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - name: Bundle the core
        shell: bash
        run: |
          mkdir -p native/windows
          cp core/target/release/alexandria_ffi.dll native/windows/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Integration suite
        shell: bash
        # One file per invocation, deliberately. On desktop, `flutter test`
        # starts the application once per run, and the second file in a single
        # invocation fails to launch with "Unable to start the app on the
        # device" — whichever file that happens to be. Looping is what lets the
        # suite hold more than one file.
        #
        # ALEXANDRIA_AUTH_MODE is deliberately not set. The application puts
        # the core into local auth mode itself, before initializing it, and a
        # runner that set the variable would hide a regression in that: the
        # suite would pass on the runner's configuration rather than on the
        # application's.
        run: |
          set -e
          for suite in $(find integration_test -name '*_test.dart' | sort); do
            echo "::group::$suite"
            flutter test "$suite" -d windows
            echo "::endgroup::"
          done

  build:
    name: Release build (windows)
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Windows needs no equivalent of the Linux desktop toolchain:
      # media_kit_libs_video ships the native libraries there.
      - run: flutter pub get

      - run: flutter build windows --release
