# IR-15: analysis, the unit and widget suite, and the integration suite on both
# target platforms, failing on any analyzer warning.
#
# There is no "known warnings" list — the moment there is one, warnings stop
# being read (Operations & Infrastructure Document §7.1).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The core is a separate repository. Building it here rather than committing a
  # binary keeps the shared library out of git history and makes a drift between
  # the two repositories fail the build instead of going unnoticed.
  #
  # Pinned to a commit rather than tracking `main`, so that a core change lands
  # here deliberately: re-vendoring the header and regenerating the bindings is
  # part of moving this value, and a moving target would make the drift check
  # pass against whatever the core happened to be that morning.
  #
  # This commit is the core's documentation review, and it is here for the
  # header: it corrects the requirement and use case identifiers in the doc
  # comments cbindgen copies into `header.h`, so the vendored copy below can
  # only match at this commit or later.
  #
  # It sits on top of the core's UC-42 indexing work, which is the substantive
  # reason the pin had to move at all: that added `alexandria_index_pause`,
  # `alexandria_index_cancel`, `alexandria_index_resume` and
  # `alexandria_index_runs_active_json`, and gave
  # `alexandria_index_refresh_start` a second parameter. The indexing
  # experience calls all five, and the pin before it predated every one of
  # them — which left this check failing on `main` for two days and would have
  # shipped a release whose FFI lookups miss at run time.
  #
  # It also carries the core's relicensing commit, which changes LICENSE,
  # README and the crates' metadata and no code at all. The desktop packages
  # carry copyleft libraries, so the core they are built from has to be the
  # tree whose licence says so — pointing at the commit before it would offer
  # anyone exercising their GPL rights a source tree marked proprietary.
  #
  # Everything the earlier pins were chosen for is still true of this one: the
  # collections listing UC-26 and UC-27 need (core UC-46), and the recovery
  # codes UC-40, UC-41 and UC-42 are specified against since the core dropped
  # e-mail confirmation and password reset on 2026-08-18.
  CORE_REPOSITORY: artur-rios/alexandria-api
  # alexandria-api#125's merge commit: the first core carrying music
  # enrichment, which is what `native/include/alexandria_ffi.h` is vendored
  # from. The pin and the vendored header move together — the drift check
  # below is exactly the guard against them moving apart, and it had been
  # red because the header was ahead of a pin nobody bumped.
  CORE_REF: 3b4e2fd1ebe0325e052398c1a634d4caffd7220d

  # Pinned rather than "whatever stable is today", because pubspec.lock is
  # committed and is the real pin: the Flutter SDK constrains its own pinned
  # packages, so a newer SDK rewrites the lock during `flutter pub get` and the
  # build then runs against dependencies nobody chose. This must match the SDK
  # the committed lock was resolved with. Upgrading is a deliberate change to
  # both, never a side effect of a fresh runner.
  FLUTTER_VERSION: 3.47.1

  # The Windows ffmpeg development libraries, pinned. The 7.1 series
  # specifically — see the comment on the install step for why a newer one
  # does not build.
  FFMPEG_RELEASE: autobuild-2026-08-16-13-00
  FFMPEG_ARCHIVE: ffmpeg-n7.1.5-16-g9a4bb2c579-win64-gpl-shared-7.1.zip

jobs:
  analyze:
    name: Analyze and generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          dart pub get --directory tools/alexandria_lints

      # The drift check lives in the integration job rather than here. The
      # core's header is not committed — `crates/alexandria-ffi/build.rs`
      # generates it with cbindgen and the core's .gitignore excludes it — so a
      # clone alone never contains it, and comparing against a clone reported
      # drift unconditionally. The integration job builds the core, which is
      # what makes the header exist, so that is where the comparison can be
      # honest.

      - name: Regenerate and check for a diff
        run: |
          dart run ffigen --config ffigen.yaml
          dart run build_runner build
          flutter gen-l10n
          if ! git diff --exit-code; then
            echo "::error::Generated output differs from what is committed. Run the generators and commit the result."
            exit 1
          fi

      # The release workflow builds the core too, and a release that linked
      # against a different commit than the one the integration suite ran
      # against would ship something nothing had tested. Both files carry the
      # value because a workflow cannot read another's env, so the two are held
      # together here rather than by anyone remembering.
      - name: Core pin agreement
        run: |
          set -e
          pin_of() {
            grep -E '^  CORE_REF:' "$1" | head -1 | awk '{print $2}'
          }
          ci=$(pin_of .github/workflows/ci.yml)
          release=$(pin_of .github/workflows/release.yml)

          echo "ci.yml:      $ci"
          echo "release.yml: $release"

          if [ "$ci" != "$release" ]; then
            echo "::error::CORE_REF disagrees between ci.yml and release.yml. Move both together — a release must link against the commit the integration suite ran against."
            exit 1
          fi

          case $release in
            main | master | "")
              echo "::error::release.yml pins CORE_REF to a branch. A tag must name a commit, or the same tag can build twice and ship two different cores."
              exit 1
              ;;
          esac

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # The project's own source must be clean. The rules are proven to actually
      # fire by the fixture suite in the `test` job — a plugin that failed to
      # load would report nothing here and look like a pass.
      - name: Layering rules
        run: dart run custom_lint

  test:
    # Both platforms, and the goldens are why. `case_painter.dart` typesets
    # the sleeve, and text is the one thing a renderer does differently on
    # each operating system — a golden made on one and only ever checked on
    # the other is a golden nobody is checking. That is not hypothetical
    # here: this suite was red on Linux for three days while passing on the
    # machine the goldens came from, because nothing ran it on both.
    #
    # Running it twice costs a few minutes; the alternative costs a
    # regression that only one developer's machine can see.
    name: Unit and widget tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # IR-11: a key present in one language and absent from the other fails the
      # build. The parity test in test/core/l10n is what enforces it.
      - name: Localization parity
        run: flutter test test/core/l10n

      - name: Test with coverage
        run: flutter test --coverage

      # TEMPORARY, removed by the commit that adds the files it produces:
      # a golden variant for this platform can only be made ON this
      # platform, and no developer machine here runs Windows. The comparator
      # writes variants rather than base files off Linux, so this cannot
      # overwrite the reference.
      - name: Generate this platform's golden variants
        if: matrix.platform == 'windows'
        run: flutter test --update-goldens
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: windows-goldens
          path: |
            test/**/goldens/*.windows.png
          if-no-files-found: error

      # IR-02: proven against the fixture package, so what runs here is the
      # plugin itself rather than a reimplementation of its logic.
      #
      # Linux only. It exercises the analyzer plugin, which has no
      # platform-dependent behaviour to catch, and running it on both would
      # be paying twice for one answer — where the suite above genuinely
      # answers differently per platform, which is the whole reason this job
      # is a matrix.
      - name: Layering rules against the fixtures
        if: matrix.platform == 'linux'
        run: flutter test analysis_test --timeout 5x

      # One coverage report, from one platform. Two runners uploading under
      # the same artifact name collide, and a second measurement of the same
      # lines answers nothing new.
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: coverage
          path: coverage/lcov.info

  integration:
    name: Integration (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            core_artifact: alexandria_ffi.dll
            core_destination: native/windows
          - os: ubuntu-latest
            platform: linux
            core_artifact: libalexandria_ffi.so
            core_destination: native/linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries at build time. The package list mirrors
      # the core repository's own workflow; the core builds on Linux only there,
      # so the Windows half below is this repository's to carry.
      - name: Install the ffmpeg development libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev \
            libswresample-dev pkg-config clang

      # ffmpeg-sys-next has no pkg-config to find on Windows, so it is pointed
      # at an unpacked release build through FFMPEG_DIR. The shared variant is
      # the one that ships headers and import libraries, and its bin directory
      # goes on PATH: a shared build links the core against avcodec, avformat,
      # avutil, avfilter, avdevice, swscale, and swresample by name, and
      # without them the core builds and then fails to load — which surfaces as
      # an unrelated-looking "core could not be loaded".
      #
      # The 7.1 series, not master. ffmpeg-sys-next binds the hwcontext headers
      # without the vendor SDKs by stubbing them, and its CUDA stub declares
      # only CUcontext and CUstream. FFmpeg 7.1's hwcontext_cuda.h needs
      # exactly those; master's added fields typed CUarray and
      # CUDA_ARRAY3D_DESCRIPTOR, which the stub does not declare, so bindgen
      # fails on a header it cannot parse. A newer ffmpeg needs a version of
      # that crate that knows about it.
      #
      # Pinned to a dated autobuild release rather than the `latest` tag. That
      # tag's assets rotate as new series are cut: it carried a 7.1 build until
      # it did not, and the download then 404'd on every pull request with
      # nothing in this repository having changed. A dated tag is immutable, so
      # the only way this moves now is somebody moving it.
      #
      # The unpacked directory carries the exact build in its name, so it is
      # discovered rather than spelled out.
      - name: Install the ffmpeg development libraries (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_ARCHIVE}"
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg > /dev/null
          root=$(find /tmp/ffmpeg -maxdepth 1 -mindepth 1 -type d | head -1)
          test -f "$root/include/libavutil/hwcontext_cuda.h"
          echo "FFMPEG_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      # Now that the core has been built, its generated header exists and can
      # actually be compared. Linux only: the header is the same on both, and
      # running it twice would only double the failure.
      - name: Check the vendored header against the core's
        if: matrix.platform == 'linux'
        run: |
          if ! diff -u core/crates/alexandria-ffi/src/header.h \
                       native/include/alexandria_ffi.h; then
            echo "::error::native/include/alexandria_ffi.h has drifted from the core's header. Re-copy it and run 'dart run ffigen --config ffigen.yaml'."
            exit 1
          fi

      - name: Bundle the core
        shell: bash
        run: |
          mkdir -p "${{ matrix.core_destination }}"
          cp "core/target/release/${{ matrix.core_artifact }}" \
             "${{ matrix.core_destination }}/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # libmpv is media_kit_video's build-time dependency on Linux: its
      # CMakeLists links PkgConfig::mpv, and without the development package
      # the desktop build fails at the generate step rather than at link time
      # (UC-19). Windows needs no equivalent — media_kit_libs_video ships the
      # native libraries there.
      - name: Install the Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb libmpv-dev mpv

      - run: flutter pub get

      - name: Integration suite
        shell: bash
        # One file per invocation, deliberately. On desktop, `flutter test`
        # starts the application once per run, and the second file in a single
        # invocation fails to launch with "Unable to start the app on the
        # device" — whichever file that happens to be. Looping is what lets the
        # suite hold more than one file.
        #
        # ALEXANDRIA_AUTH_MODE is deliberately not set. The application puts
        # the core into local auth mode itself, before initializing it, and a
        # runner that set the variable would hide a regression in that: the
        # suite would pass on the runner's configuration rather than on the
        # application's.
        run: |
          set -e
          for suite in $(find integration_test -name '*_test.dart' | sort); do
            echo "::group::$suite"
            if [ "${{ matrix.platform }}" = "linux" ]; then
              xvfb-run -a flutter test "$suite" -d linux
            else
              flutter test "$suite" -d windows
            fi
            echo "::endgroup::"
          done

  build:
    name: Release build (${{ matrix.platform }})
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # libmpv is media_kit_video's build-time dependency on Linux: its
      # CMakeLists links PkgConfig::mpv, and without the development package
      # the desktop build fails at the generate step rather than at link time
      # (UC-19). Windows needs no equivalent — media_kit_libs_video ships the
      # native libraries there.
      - name: Install the Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - run: flutter pub get

      - run: flutter build ${{ matrix.platform }} --release
