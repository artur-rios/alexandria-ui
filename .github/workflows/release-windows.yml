# IR-16: the Windows packages of a release.
#
#   Windows   an MSIX package, an installer executable, and a portable .zip
#
# Jenkins builds the Linux packages (ci/release-build.sh, release.build in yggdrasil.yml) and dispatches this workflow on
# the release's tag once the mirror has pushed it (release.windows in yggdrasil.yml), waits for it, and attaches the
# three files of the artifact below to the release. It runs on nothing else, and it is not a pull request check.
#
# Each package bundles the Alexandria core's shared library. The core travels inside the application bundle as a library:
# nothing here installs, updates, or launches a service (Operations & Infrastructure Document §7.3).
#
# The portable archive is the whole release bundle and nothing else, for running the application without an install step.
# The installer places it: it finds an existing installation, in the directory chosen and in the one a previous install
# recorded, and replaces it, removing what that install wrote rather than the directory it was written into. See
# packaging/windows/installer.iss.
#
# Packages are produced unsigned. Code signing for Windows needs a certificate the project does not hold, and the release
# is deliberately unsigned until before the first public release (§7.2).
#
# The Windows packages carry ffmpeg beside the executable: the core links libavcodec, libavdevice, libavfilter,
# libavformat, libavutil, libswresample, and libswscale, which have to be there wherever it runs.

name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.4.0"
        required: true

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # The LGPL build, not the GPL one CI uses.
  #
  # This once said the choice was forced, because the core was proprietary and
  # only LGPL terms could be met. That is no longer true: the source is under
  # the Artur Rios Attribution License, which does not stop a package from being
  # distributed under the GPL as a combined work, so either variant would be
  # lawful to ship. The LGPL build stays because it is still the better one to
  # carry — the GPL variant adds x264 and x265, which are encoders, and nothing
  # here re-encodes. Carrying obligations for capabilities the application does
  # not have would be a strange thing to do deliberately.
  #
  # Linux cannot make the same choice. It carries libmpv, which is copyleft
  # from any distribution and is what plays the video, so a Linux package is a
  # combined work under the GPL regardless of which ffmpeg is bundled. See the
  # Legal section of the README.
  #
  # Pinned to the same dated autobuild release CI pins, and for the same
  # reason. This used to point at the `latest` tag, whose assets rotate as new
  # series are cut: it carried a 7.1 build until it did not, and by the first
  # tagged run that tag held only 8.1 and 9.0 and the download 404'd. A dated
  # tag is immutable, so the only way this moves now is somebody moving it.
  #
  # The 7.1 series specifically, not a newer one — see the long note on the
  # equivalent step in ci.yml for why ffmpeg-sys-next cannot build against
  # master's hwcontext headers.
  FFMPEG_WINDOWS_RELEASE: autobuild-2026-07-31-14-10
  FFMPEG_WINDOWS_ARCHIVE: ffmpeg-n7.1.5-12-g1fdbca85aa-win64-lgpl-shared-7.1.zip

  # The libraries a shared ffmpeg build links the core against by name. Listed
  # once so the bundling steps below cannot drift from each other.
  FFMPEG_LIBRARIES: avcodec avdevice avfilter avformat avutil swresample swscale

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The versions come from ci/pins.sh, the file the Linux builds on Jenkins read: Flutter, and the commit of the
      # core. A release links the core at the commit the integration suite ran against.
      - name: Read the pins
        shell: bash
        run: |
          set -e
          . ci/pins.sh
          {
            echo "FLUTTER_VERSION=$FLUTTER_VERSION"
            echo "CORE_REPOSITORY=$CORE_REPOSITORY"
            echo "CORE_REF=$CORE_REF"
            echo "RUST_VERSION=$RUST_VERSION"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      # The toolchain of ci/pins.sh, the one the Jenkins checks build the core with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # alexandria-core depends on ffmpeg-next, whose ffmpeg-sys-next needs the
      # ffmpeg C development libraries to build. See the CI workflow for why the
      # 7.1 series rather than master.
      - name: Install the ffmpeg development libraries
        shell: bash
        # For the fallback's `gh api` call only; the pinned download needs no
        # credential.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download
          # The same fallback CI has, and for the same reason: BtbN's autobuild
          # releases are rolling, and an old tag is deleted once it ages out.
          # A pin is the right default — a release should be built from a build
          # somebody chose — but a pin that has been deleted upstream must not
          # be the difference between a release happening and not happening.
          # This one lapsed while nobody was tagging, and the failure landed on
          # the next person to try to cut a release.
          if ! curl -fsSL -o /tmp/ffmpeg.zip \
            "$base/${FFMPEG_WINDOWS_RELEASE}/${FFMPEG_WINDOWS_ARCHIVE}"; then
            echo "::warning::${FFMPEG_WINDOWS_RELEASE} no longer carries ${FFMPEG_WINDOWS_ARCHIVE}; falling back to the newest release that has a 7.1 LGPL shared build."
            url=$(gh api repos/BtbN/FFmpeg-Builds/releases --paginate \
              --jq '.[] | .assets[] | select(.name | test("win64-lgpl-shared-7\\.1\\.zip$")) | .browser_download_url' \
              | head -1)
            test -n "$url"
            echo "::notice::using $url"
            curl -fsSL -o /tmp/ffmpeg.zip "$url"
          fi
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg > /dev/null
          root=$(find /tmp/ffmpeg -maxdepth 1 -mindepth 1 -type d | head -1)
          test -f "$root/include/libavutil/hwcontext_cuda.h"
          echo "FFMPEG_DIR=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          echo "FFMPEG_ROOT_POSIX=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Build the Alexandria core
        working-directory: core
        run: cargo build --release -p alexandria-ffi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve the version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"

          # The MSIX packager accepts only a numeric dotted version and rejects
          # anything else outright. Checked here rather than twenty minutes
          # later, three quarters of the way through the job, which is where a
          # dispatch run with a version like "0.0.2-test" first found out.
          # Exactly three numeric parts: the MSIX step appends a fourth, and
          # its packager refuses anything but four — so 1.2, 1.2.3.4 and 1..2
          # have to be refused here, not twenty minutes from now.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be three numbers, such as 1.2.3 — got: $version"
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Every package downstream takes its version from the pubspec rather
      # than from the tag: flutter_distributor names the .deb and the AppImage
      # from it, and the application reports it as its own version. Left alone,
      # a v0.0.1 release would carry a file called
      # alexandria-1.0.0+1-linux.deb and an application that called
      # itself 1.0.0. Stamped here so the tag is the one source of that number.
      #
      # The working copy only — nothing is committed. The pubspec in git keeps
      # the version the project develops against.
      - name: Stamp the version into the pubspec
        shell: bash
        run: |
          set -e
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.value }}+${{ github.run_number }}/"             pubspec.yaml
          grep '^version:' pubspec.yaml

      - run: flutter build windows --release

      # Beside the executable, which is where IR-04's resolver looks first.
      #
      # The ffmpeg libraries travel with it: a shared build links
      # alexandria_ffi.dll against them by name, so without them the package
      # installs and then fails to load the core on first launch — the kind of
      # break that only shows up on a machine that is not a build machine.
      #
      # The installer and the MSIX both take the whole Release directory, so
      # copying here is all it takes to reach every Windows package.
      - name: Bundle the core and its ffmpeg libraries
        shell: bash
        run: |
          set -e
          release=build/windows/x64/runner/Release
          cp core/target/release/alexandria_ffi.dll "$release/"

          for library in $FFMPEG_LIBRARIES; do
            # The soname carries the major version, which moves with ffmpeg, so
            # the file is matched rather than spelled out.
            found=$(find "$FFMPEG_ROOT_POSIX/bin" -name "${library}-*.dll" | head -1)
            test -n "$found" || { echo "::error::no DLL found for $library"; exit 1; }
            cp "$found" "$release/"
          done

          # LGPL obliges the licence texts to travel with the binaries.
          cp -r "$FFMPEG_ROOT_POSIX/LICENSE.txt" "$release/FFMPEG-LICENSE.txt"

      # A package that cannot load the core is the failure this whole step
      # exists to prevent, so it is checked here rather than discovered by
      # whoever installs it.
      - name: Verify every linked library is present
        shell: bash
        run: |
          set -e
          release=build/windows/x64/runner/Release
          missing=0
          for library in $FFMPEG_LIBRARIES; do
            ls "$release/${library}-"*.dll > /dev/null 2>&1 || {
              echo "::error::$library is missing from the Windows bundle"
              missing=1
            }
          done
          test -f "$release/alexandria_ffi.dll" || {
            echo "::error::alexandria_ffi.dll is missing from the Windows bundle"
            missing=1
          }
          exit $missing

      # For running the application without installing it. Deliberately placed
      # after the verification above and before the MSIX below: after, so the
      # archive cannot ship without the core and its ffmpeg libraries; before,
      # because `msix:create` writes its output into this same directory and
      # the portable archive has no business carrying a copy of the MSIX.
      - name: Build the portable archive
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # 7z is a native Windows program, so it gets a Windows path. Zipping
          # from inside the directory is what keeps the archive's entries at
          # its root rather than nested under build/windows/x64/runner.
          zip="$(cygpath -w "$PWD/dist/alexandria-${{ steps.version.outputs.value }}-windows-x64.zip")"
          (cd build/windows/x64/runner/Release && 7z a -tzip "$zip" '*' -x'!*.msix' > /dev/null)

          # The archive is the application, not a container for other
          # packages. Belt and braces alongside the -x above and the Excludes
          # in installer.iss: this directory is where msix:create writes, and
          # an archive carrying a second copy of the whole application is the
          # kind of thing nobody notices except as a suspicious download size.
          if 7z l "$zip" | grep -q '\.msix$'; then
            echo "::error::the portable archive picked up an MSIX"
            exit 1
          fi
          7z l "$zip" | tail -20

      - name: Build the MSIX package
        run: dart run msix:create --version ${{ steps.version.outputs.value }}.0

      - name: Build the installer
        env:
          ALEXANDRIA_VERSION: ${{ steps.version.outputs.value }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\windows\installer.iss

      # The three packages side by side in one directory, so the artifact holds them flat: Jenkins downloads it into a
      # directory of its name and release.windows.files (yggdrasil.yml) matches them there.
      - name: Gather the packages
        shell: bash
        run: |
          set -e
          mkdir -p dist/windows
          cp build/windows/x64/runner/Release/*.msix dist/windows/
          cp dist/*.exe dist/*.zip dist/windows/
          ls -l dist/windows

      - uses: actions/upload-artifact@v7
        with:
          name: alexandria-ui-windows
          path: dist/windows/*
          if-no-files-found: error
