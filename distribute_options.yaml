# IR-16: the Linux .deb, built by flutter_distributor.
#
# The .deb only. The MSIX comes from the `msix` package, the Windows installer
# from Inno Setup, the Flatpak from the manifest in packaging/linux/, and the
# AppImage from packaging/linux/build-appimage.sh — flutter_distributor's
# AppImage maker bundles dependencies of its own on top of the payload it is
# given, which is not what this project wants from it. All of them are produced
# by the same pipeline — .github/workflows/release.yml.

output: dist/

releases:
  - name: production
    jobs:
      - name: linux-deb
        package:
          platform: linux
          target: deb
