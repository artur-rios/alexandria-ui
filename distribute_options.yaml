# IR-16: the Linux AppImage and .deb, built by flutter_distributor.
#
# The MSIX comes from the `msix` package and the Windows installer from Inno
# Setup; the Flatpak has no flutter_distributor target and is built from the
# manifest in packaging/linux/. All five are produced by the same pipeline —
# .github/workflows/release.yml.

output: dist/

releases:
  - name: production
    jobs:
      - name: linux-deb
        package:
          platform: linux
          target: deb
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
