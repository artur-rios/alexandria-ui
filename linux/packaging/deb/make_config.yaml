# IR-16: the .deb, built by flutter_distributor from distribute_options.yaml.
#
# flutter_distributor looks for this file at exactly this path — the maker
# reads linux/packaging/<target>/make_config.yaml and fails outright if it is
# absent, which is what it did on the first tagged run.
#
# Paths here are relative to the project root, not to this file.

display_name: Alexandria

# Lowercase, and only letters, digits, and -+. per Debian policy.
package_name: alexandria

maintainer:
  name: Artur Rios
  email: arturdev@duck.com

priority: optional
section: video

# Overwritten by the release build with the bundle's actual size in
# kilobytes before packaging. Debian treats Installed-Size as advisory, so a
# stale value here is cosmetic rather than a build failure — but a value
# nobody maintains is worse than one the pipeline measures.
installed_size: 0

icon: packaging/linux/io.github.artur_rios.Alexandria.png

generic_name: Personal library
categories:
  - AudioVideo
  - Player
  - Office
  - Viewer

keywords:
  - library
  - catalog
  - media
  - documents

startup_notify: true
essential: false

# Ubuntu 24.04 LTS, which is what the release runner builds on.
#
# The soname is part of each package's name and moves between Ubuntu releases,
# so this list picks a release rather than trying to span several. That is
# deliberate: the binary is compiled against 24.04's headers, and a package
# that installed on 22.04 and then misbehaved would be worse than one that
# refuses. Somebody on another release has the AppImage, the Flatpak, the
# tarball, and the installer — all four of which carry their own ffmpeg or get
# it from a runtime.
#
# Unlike those four, this package deliberately does NOT bundle ffmpeg: asking
# the distribution for it is the entire point of a .deb, and a bundled copy
# would shadow the system's while going unpatched. The release build builds
# this package from a pristine bundle, before the bundling step runs.
#
# Verified by installing the built package on the runner, so these names are
# checked against a real apt rather than trusted.
dependencies:
  - libavcodec60
  - libavformat60
  - libavdevice60
  - libavfilter9
  - libavutil58
  - libswscale7
  - libswresample4
  # media_kit's video player links libmpv, and GTK is the desktop toolkit the
  # Flutter Linux embedder itself needs. Both are as much a runtime dependency
  # as ffmpeg, and were as absent from this list.
  - libmpv2
  - libgtk-3-0t64

# The saved-page engine runs only inside Chromium's sandbox, which needs
# unprivileged user namespaces (third_party/webview_cef/FORK.md). Ubuntu 23.10
# and later, 24.04 included, restrict them through AppArmor, so without this
# the engine never starts and pages are drawn as widgets. The profile grants
# the executable user namespaces and confines nothing else, the way Ubuntu's
# own profile does for Chrome. Written only where AppArmor 4, the release that
# brought the restriction, is installed. install.sh writes the same profile
# under its own name when it is run as root.
#
# Written by the maintainer script rather than shipped as a file because
# flutter_distributor packages the bundle and nothing else. Each entry is shell,
# appended to the postinst/postrm flutter_distributor generates.
postinstall_scripts:
  - |
    if [ -f /etc/apparmor.d/abi/4.0 ] && command -v apparmor_parser > /dev/null 2>&1; then
      cat > /etc/apparmor.d/alexandria <<'PROFILE'
    # Installed by the alexandria package. Lets the saved-page engine create the
    # user namespaces Chromium's sandbox runs in.
    abi <abi/4.0>,
    include <tunables/global>

    profile alexandria /opt/alexandria/alexandria flags=(unconfined) {
      userns,

      include if exists <local/alexandria>
    }
    PROFILE
      chmod 644 /etc/apparmor.d/alexandria
      apparmor_parser -r -T -W /etc/apparmor.d/alexandria > /dev/null 2>&1 || true
    fi

# Only on remove and purge. On upgrade the old postrm runs first and the new
# postinst rewrites the profile straight after, so removing it there would
# only open a window in which it is missing.
postuninstall_scripts:
  - |
    if [ "$1" = remove ] || [ "$1" = purge ]; then
      if [ -f /etc/apparmor.d/alexandria ]; then
        if command -v apparmor_parser > /dev/null 2>&1; then
          apparmor_parser -R /etc/apparmor.d/alexandria > /dev/null 2>&1 || true
        fi
        rm -f /etc/apparmor.d/alexandria
      fi
    fi
