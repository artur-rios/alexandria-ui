# IR-16: the AppImage, built by flutter_distributor from
# distribute_options.yaml.
#
# Same story as the .deb config beside this one: the maker reads
# linux/packaging/<target>/make_config.yaml and fails outright if it is absent.
#
# `icon` is required here, unlike in the .deb config where it is optional — the
# AppImage maker reads it as a non-nullable string. Paths are relative to the
# project root, not to this file.

display_name: Alexandria

icon: packaging/linux/io.github.artur_rios.Alexandria.png

metainfo: packaging/linux/io.github.artur_rios.Alexandria.metainfo.xml

generic_name: Personal library

categories:
  - AudioVideo
  - Player
  - Office
  - Viewer

keywords:
  - library
  - catalog
  - media
  - documents

startup_notify: true

# KNOWN GAP — this AppImage does not carry ffmpeg.
#
# The core links it, and an AppImage is supposed to be the format that needs
# nothing from the host. Bundling ffmpeg and everything it in turn pulls in is
# what a tool like linuxdeploy does, and choosing that is the open question
# recorded at the top of .github/workflows/release.yml. Until then this runs
# only where ffmpeg is already installed.
