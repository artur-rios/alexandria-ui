name: alexandria_desktop
description: "The cross-platform desktop front-end for Alexandria."
publish_to: "none"
version: 1.0.0+1

# Every constraint below was resolved to the latest stable release at the time the
# dependency was first added, per the version policy in
# docs/requirements/Technology Stack Document.md §1.1. `pubspec.lock` is committed
# and is the real pin; upgrading is a deliberate change to it, never a side effect
# of a fresh checkout.

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Composition root and state management (IR-07).
  flutter_riverpod: ^3.0.0

  # Immutable domain models and the typed failure union (IR-08).
  freezed_annotation: ^3.1.0

  # Deserializes the JSON payloads the core returns across the FFI boundary
  # (Technology Stack Document §5). First needed by UC-02's login result.
  #
  # Held at 4.9 rather than the current 4.12 because json_serializable above
  # 6.11 needs analyzer 10+, and the in-repo custom_lint plugin in
  # tools/alexandria_lints pins analyzer ^8.4.0. Both move together when that
  # plugin is upgraded; neither moves alone.
  json_annotation: ^4.9.0

  # The Alexandria core boundary (IR-03, IR-04, IR-09).
  ffi: ^2.2.0

  # Application-support directory, database path, and log file location
  # (IR-05, IR-13).
  path: ^1.9.1
  path_provider: ^2.1.6

  # The local settings store (IR-12).
  shared_preferences: ^2.5.5

  # Structured logging (IR-13).
  logging: ^1.3.0

  # Localization for pt-BR and en (IR-11).
  intl: ^0.20.2

  # The desktop shell (Technology Stack Document §3.5). Enforces the minimum
  # window size and reads and writes the window's geometry, which is what
  # UC-38's FR-UX-03 persists across runs.
  window_manager: ^0.5.2

  # The connected displays, declared directly rather than leaned on as a
  # transitive dependency of window_manager. UC-38 AF-02 needs to know whether
  # stored geometry still lands on a display that exists, and window_manager
  # itself reports the window, not the screens.
  screen_retriever: ^0.2.2

  # The platform's native folder picker (Technology Stack Document §3.5).
  # FR-LB-01 asks for the native one specifically: a folder chosen through a
  # dialog the owner recognizes, not a path typed into a text field.
  file_selector: ^1.1.0

  # Renders the editor's live preview (Technology Stack Document §5, UC-18
  # FR-ME-07). The package is discontinued upstream; it is what the stack
  # document names, it resolves and builds against this SDK, and replacing it
  # is a change to that document rather than to this use case.
  flutter_markdown: ^0.7.7+1

  # The playback engine and its render surface (Technology Stack Document §5).
  # libmpv-backed, chosen because subtitle-track and audio-track selection on
  # both Windows and Linux are hard requirements (FR-PL-03, FR-PL-04) and it
  # plays the container and codec range a real library holds without
  # transcoding (FR-PL-01). The `libs` packages carry the native libmpv build
  # for each target, which is what keeps the application from depending on
  # whatever mpv the owner happens to have installed.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_audio: ^1.0.7
  archive: ^4.1.0
  xml: ^7.0.1
  flutter_widget_from_html: ^0.17.2
  pdfrx: ^2.4.7
  markdown: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Analysis. `flutter_lints` is the base set; `custom_lint` runs the in-repo
  # layering rules in tools/alexandria_lints (IR-02).
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  alexandria_lints:
    path: tools/alexandria_lints

  # Code generation: freezed models and the ffigen bindings (IR-03, IR-08).
  build_runner: ^2.15.1
  freezed: ^3.2.3
  ffigen: ^21.0.0
  json_serializable: ^6.11.2

  # Test doubles for the gateway interfaces. The only mocking library in the
  # project, per the Technology Stack Document §7.
  mocktail: ^1.0.5

  # Windows MSIX packaging (IR-16).
  msix: ^3.18.0
  riverpod: ^3.4.2

flutter:
  uses-material-design: true
  generate: true

# IR-16: the MSIX package. Produced unsigned — code signing needs a certificate
# the project does not hold, deferred in Operations & Infrastructure §7.2.
msix_config:
  display_name: Alexandria
  publisher_display_name: Artur Rios
  identity_name: io.github.arturrios.Alexandria
  # The core's DLL sits beside the executable in the release bundle, which is
  # where IR-04's resolver looks first, so it is inside the package already.
  output_name: alexandria
  capabilities: ""
  install_certificate: false
